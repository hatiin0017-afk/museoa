<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    width: 1920px;
    height: 1080px;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 60px;
    font-family: 'Noto Sans KR', sans-serif;
    overflow: hidden;
  }

  .overlay {
    display: flex;
    align-items: center;
    gap: 28px;
    background: rgba(255, 220, 230, 0.18);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 2px solid rgba(255, 180, 200, 0.35);
    border-radius: 999px;
    padding: 18px 48px 18px 18px;
    min-width: 680px;
    max-width: 1000px;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  .overlay.visible { opacity: 1; }

  /* 프로필 이미지 */
  .album-wrap {
    position: relative;
    width: 120px;
    height: 120px;
    flex-shrink: 0;
  }

  .album-art {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255, 160, 190, 0.6);
    animation: spin 10s linear infinite;
    animation-play-state: paused;
  }

  .album-art.playing { animation-play-state: running; }

  .album-hole {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(30, 10, 20, 0.85);
    pointer-events: none;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* 텍스트 영역 */
  .info {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }

  .live-label {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 4px;
    color: rgba(255, 180, 200, 0.85);
    text-transform: uppercase;
  }

  .track-wrap {
    overflow: hidden;
    white-space: nowrap;
  }

  .track-name {
    font-size: 30px;
    font-weight: 700;
    color: #fff;
    display: inline-block;
    white-space: nowrap;
    text-shadow: 0 2px 12px rgba(255, 120, 160, 0.3);
  }

  .track-name.scrolling {
    animation: marquee 12s linear infinite;
  }

  @keyframes marquee {
    0%,15%   { transform: translateX(0); }
    75%,100% { transform: translateX(var(--md, -100px)); }
  }

  .artist-name {
    font-size: 20px;
    font-weight: 400;
    color: rgba(255, 210, 220, 0.75);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <div class="album-wrap">
    <img class="album-art" id="albumArt" src="../assets/profile.jpg" alt="">
    <div class="album-hole"></div>
  </div>
  <div class="info">
    <span class="live-label">Live BGM</span>
    <div class="track-wrap">
      <span class="track-name" id="trackName">–</span>
    </div>
    <span class="artist-name" id="artistName">–</span>
  </div>
</div>

<script>
const WORKER_URL = 'https://mos-proxy.hatiin0017.workers.dev';
const MOS_TOKEN  = '9c63974e5e0874eb3c2f4bb3fabcec99';

const overlay    = document.getElementById('overlay');
const albumArt   = document.getElementById('albumArt');
const trackName  = document.getElementById('trackName');
const artistName = document.getElementById('artistName');

function setPlaying(on) {
  albumArt.classList.toggle('playing', on);
}

function updateTrack(title, artist) {
  overlay.classList.add('visible');
  trackName.textContent  = title  || '–';
  artistName.textContent = artist || '–';

  const el = trackName;
  el.classList.remove('scrolling');
  void el.offsetWidth;
  requestAnimationFrame(() => {
    const pw = el.parentElement.clientWidth;
    if (el.scrollWidth > pw + 4) {
      el.style.setProperty('--md', `-${el.scrollWidth - pw + 16}px`);
      el.classList.add('scrolling');
    }
  });
}

const socket = io(WORKER_URL, {
  auth: { publicToken: MOS_TOKEN },
  transports: ['polling']
});

socket.on('connect', () => console.log('연결됨'));

socket.on('update', (instance) => {
  const state = instance.scannerState;
  const playing = !!state?.title;
  updateTrack(
    state?.title  || '',
    state?.artist || state?.subtitle || ''
  );
  setPlaying(playing);
});

socket.on('disconnect', () => setPlaying(false));
socket.on('connect_error', (e) => console.error('연결 에러:', e.message));
</script>
</body>
</html>
