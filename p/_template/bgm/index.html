<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: transparent;
    overflow: hidden;
    display: inline-flex;
  }

  /* ==========================================
     테마 커스텀 영역
  ========================================== */
  .bar {
    display: inline-flex;
    align-items: center;
    height: 100px;
    border-radius: 50px;
    /* 배경 & 테두리 */
    background: rgba(255, 220, 230, 0.18);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 2px solid rgba(255, 180, 200, 0.35);
    padding: 0 28px 0 6px;
    gap: 0;
    /* 길이 자동 조정 */
    transition: width 0.4s ease;
    opacity: 0;
    transition: opacity 0.5s ease, width 0.4s ease;
    min-width: 160px;
    max-width: 560px;
  }

  .bar.visible { opacity: 1; }

  .profile-wrap {
    position: relative;
    flex-shrink: 0;
    z-index: 2;
  }

  .profile-bg {
    width: 86px; height: 86px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    /* 프로필 테두리 */
    border: 3px solid rgba(255, 160, 190, 0.6);
    animation: spin 10s linear infinite;
    animation-play-state: paused;
  }

  .profile-bg.playing { animation-play-state: running; }

  .profile-bg img {
    width: 100%; height: 100%;
    object-fit: cover;
  }

  /* 가운데 구멍 */
  .profile-hole {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 16px; height: 16px;
    border-radius: 50%;
    background: rgba(20, 8, 14, 0.85);
    pointer-events: none;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .song-info {
    overflow: hidden;
    padding: 0 14px;
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
  }

  .live-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    /* LIVE BGM 색상 */
    color: rgba(255, 180, 200, 0.85);
    text-transform: uppercase;
  }

  .song-title-wrap {
    white-space: nowrap;
    overflow: hidden;
  }

  .song-title-text {
    display: inline-block;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 22px;
    font-weight: 700;
    /* 곡명 색상 */
    color: #fff;
    white-space: nowrap;
  }

  .song-artist {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 500;
    /* 아티스트명 색상 */
    color: rgba(255, 210, 220, 0.75);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* ==========================================
     테마 커스텀 영역 끝
  ========================================== */

  @keyframes rolling {
    0%   { transform: translateX(0); }
    100% { transform: translateX(var(--roll-dist)); }
  }
</style>
</head>
<body>

<div class="bar" id="bar">
  <div class="profile-wrap">
    <div class="profile-bg" id="profileBg">
      <!-- 이미지: assets/bgm.jpg -->
      <img src="../assets/bgm.jpg" alt="" onerror="this.style.display='none'">
    </div>
    <div class="profile-hole"></div>
  </div>
  <div class="song-info">
    <span class="live-label">Live BGM</span>
    <div class="song-title-wrap" id="titleWrap">
      <span class="song-title-text" id="titleText">–</span>
    </div>
    <div class="song-artist" id="artistText">–</div>
  </div>
</div>

<script>
// ==========================================
// 여기만 수정
const WORKER_URL = 'https://mos-proxy.hatiin0017.workers.dev';
const MOS_TOKEN  = '9c63974e5e0874eb3c2f4bb3fabcec99';
// ==========================================

const bar       = document.getElementById('bar');
const profileBg = document.getElementById('profileBg');
const titleText = document.getElementById('titleText');
const titleWrap = document.getElementById('titleWrap');
const artistText= document.getElementById('artistText');

let rollingAnim = null;

function applyRolling(el, container) {
  // 기존 애니메이션 초기화
  el.style.animation = 'none';
  el.style.transform = 'translateX(0)';
  el.innerHTML = el.textContent;
  rollingAnim = null;

  requestAnimationFrame(() => {
    const overflow = el.scrollWidth - container.clientWidth;
    if (overflow > 0) {
      const gap = 60;
      const totalDist = el.scrollWidth + gap;
      const duration = totalDist / 70; // 속도 조절 (숫자 낮을수록 빠름)
      const txt = el.textContent;
      el.style.setProperty('--roll-dist', `-${totalDist}px`);
      el.innerHTML = `<span>${txt}</span><span style="padding-left:${gap}px">${txt}</span>`;
      el.style.animation = `rolling ${duration}s linear infinite`;
      rollingAnim = true;
    }
  });
}

function setPlaying(on) {
  profileBg.classList.toggle('playing', on);
}

function updateTrack(title, artist) {
  bar.classList.add('visible');

  // 롤링 초기화 후 텍스트 세팅
  titleText.style.animation = 'none';
  titleText.style.transform = 'translateX(0)';
  titleText.textContent = title || '–';
  artistText.textContent = artist || '–';

  applyRolling(titleText, titleWrap);
}

const socket = io(WORKER_URL, {
  auth: { publicToken: MOS_TOKEN },
  transports: ['polling']
});

socket.on('update', (instance) => {
  const state = instance.scannerState;
  updateTrack(
    state?.title  || '',
    state?.artist || state?.subtitle || ''
  );
  setPlaying(!!state?.title);
});

socket.on('disconnect', () => setPlaying(false));
</script>
</body>
</html>
