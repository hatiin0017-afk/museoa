<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>키리 · 방송 일정</title>
<style>
@font-face{font-family:Gaegu;src:url('../assets/Gaegu-Bold.ttf');font-weight:700;font-display:swap}
*{box-sizing:border-box}
body{margin:0;background:#eff7ff;color:#354e79;font:600 16px/1.4 system-ui,sans-serif}
.canvas{position:relative;width:min(100%,940px);aspect-ratio:940/920;margin:auto;overflow:clip}
main{position:absolute;inset:0 auto auto 0;width:940px;height:920px;transform-origin:top left;background:url('../assets/schedule.webp') center/100% 100% no-repeat}
/* Match the upper middle slice of the illustrated page on both layouts. */
.schedule-title{position:absolute;top:0;left:9%;width:84%;height:76.3%;margin:0;pointer-events:none}
.schedule-title svg{display:block;width:100%;height:100%}
.hero a{position:absolute;top:6%;right:2%;width:13%;height:4.5%}
button{font:inherit;color:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid #776dc1;outline-offset:1px}
.sheet{position:absolute;inset:33.6% 12% 13.8% 13%;display:grid;grid-template-rows:auto 1fr;gap:16px}
.bar,.tabs,.pager{display:flex;align-items:center}
.bar,.pager{justify-content:space-between}
.tabs{gap:8px}
.tabs button,.pager button{border:1px solid #bbcbe4;background:#fffaf6;border-radius:14px}
.tabs button{font:700 23px/1 Gaegu,sans-serif;padding:7px 14px;box-shadow:0 2px 0 #cbd5e9}
.tabs [aria-pressed=true]{background:#ffe7f2;border-color:#dfacc9;color:#89456c}
.sample,.legend,.detailhead{font-size:14px;color:#566881}
.views{position:relative;display:grid;isolation:isolate;overflow:clip}
#month,#week{grid-area:1/1;min-width:0;padding:8px 2px}
.views [hidden]{visibility:hidden;pointer-events:none}
#month{display:grid;grid-template-columns:1.15fr 1fr;gap:22px}
#month[hidden]{display:grid}#week[hidden]{display:block}
.card{min-width:0}
.pager strong,h2{font:700 31px/1.2 Gaegu,sans-serif;color:#405991}
.pager button{width:36px;height:32px;background:#eef5ff;font-size:19px}
.grid{margin-top:14px;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto repeat(6,44px);text-align:center;align-items:center}
.weekday{font:700 20px Gaegu,sans-serif}
.day{justify-self:center;width:38px;height:38px;padding:0;border:1px solid transparent;border-radius:50%;background:transparent}
.day.has-show,.legend .has-show{background:#edf5ff;border:1px solid #a8c7e7}
.day.off-day,.legend .off-day{background:#dadde2;border:1px solid #abb2bc;color:#47515f}
.day:hover{box-shadow:inset 0 0 0 1px #90abcd}
.day[aria-pressed=true]{outline:2px solid #d78eb1;outline-offset:1px}
.day:focus-visible{outline:3px solid #776dc1;outline-offset:1px}
.sun{color:#a95176}.sat{color:#4578aa}
.legend{display:flex;align-items:center;gap:14px;margin:8px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:13px;height:13px;border-radius:50%}
.detail{border-left:2px dashed #ced8e8;padding-left:20px}.detailhead{margin-top:5px}
h2{margin:7px 0 18px}
.event{margin:0 2px;padding:10px 0 12px 13px;border-left:3px solid #a8cbd7}
.event+.event{margin-top:12px}
.event time{display:block;color:#455e7a;font-variant-numeric:tabular-nums;font-size:16px}
.event strong{display:block;font:700 26px/1.25 Gaegu,sans-serif}
.event.off{border-color:#abb2bc}
.tag{font:700 18px Gaegu,sans-serif;color:#526c93}.resting{color:#745783}
.week .pager{margin-bottom:12px}.row{display:grid;grid-template-columns:104px 70px 1fr 44px;align-items:center;padding:5px 12px;min-height:46px;border-bottom:1px dashed #c3cfe1;gap:10px}
.row.active{background:#ffe7f0;border-radius:12px}.row strong{font:700 23px Gaegu,sans-serif}.row time{font-variant-numeric:tabular-nums}.empty{color:#6d7d95}

.day{position:relative}.day[aria-current=date]:after,.legend .today-mark{width:5px;height:5px;border-radius:50%;background:#445887}
.day[aria-current=date]:after{content:"";position:absolute;bottom:3px;left:calc(50% - 2.5px)}
@media(max-width:700px){
 .canvas{aspect-ratio:auto}
 main{--art-top:74.68vw;--art-right:7vw;--art-left:9vw;position:relative;width:100%;height:auto;background:none;padding:33vw 9% 14vw 11%;isolation:isolate}
 @supports (width:round(down,1.5px,1px)){
   main{--art-top:round(down,74.68vw,1px);--art-right:round(down,7vw,1px);--art-left:round(down,9vw,1px)}
 }
 main:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-style:solid;
   border-width:var(--art-top) var(--art-right) 17.42vw var(--art-left);border-image:url('../assets/schedule.webp') 76.3% 7% 17.8% 9% fill / 1 / 0 stretch round}
 .schedule-title{left:var(--art-left);width:calc(100% - var(--art-left) - var(--art-right));height:var(--art-top)}
 .hero a{top:5.4vw;right:1.4%;width:18%;height:6vw}
 .sheet{position:relative;inset:auto;gap:10px}
 .bar{flex-wrap:wrap;gap:4px 8px}
 .tabs{gap:5px}.tabs button{min-height:40px;padding:6px 9px;font-size:20px}
 .sample{font-size:11px}
 #month{grid-template-columns:minmax(0,1fr);align-content:start;gap:12px}
 .pager strong,h2{font-size:24px}.pager button{width:40px;height:40px}
 .grid{margin-top:8px;grid-template-rows:25px repeat(6,44px)}
 .day{width:min(40px,94%);height:40px;font-size:16px}
 .legend{font-size:12px;margin:6px 0}
 .detail{border:0;border-top:1px dashed #bbc9d8;padding:10px 0 0}
 h2{margin:0 0 6px}.event{padding:5px 0 5px 10px}.event+.event{margin-top:6px}.event strong{font-size:22px}
 .week .pager strong{font-size:clamp(17px,4.5vw,24px)}
 .row{grid-template-columns:62px 43px minmax(0,1fr) 31px;font-size:13px;min-height:55px;gap:4px;padding:5px 2px}
 .row strong{font-size:19px}.row .tag{font-size:15px}
 .views{min-height:490px}
}
</style>
<div class="canvas"><main><header class="hero"><h1 class="schedule-title" aria-label="방송 일정"><svg viewBox="112.86 0 1053.36 956.802" preserveAspectRatio="none" aria-hidden="true" focusable="false"><use href="../assets/title-ink.svg#schedule"/></svg></h1><a href="../index.html#profile" aria-label="상세 프로필 보기"></a></header><div class="sheet"><div class="bar"><nav class="tabs" aria-label="일정 보기"><button id="monthly">월간 달력</button><button id="weekly">주간 일정</button></nav><span class="sample">예시 일정 · 한국 시간</span></div><div class="views"><section id="month" class="cols"><div class="card tape"><div class="pager"><button data-move="-1" aria-label="이전 달">‹</button><strong id="ym"></strong><button data-move="1" aria-label="다음 달">›</button></div><div class="grid" id="grid"></div><p class="legend"><span><i class="has-show" aria-hidden="true"></i>방송</span><span><i class="off-day" aria-hidden="true"></i>휴방</span><span><i class="today-mark" aria-hidden="true"></i>오늘</span></p></div><article class="card detail" aria-live="polite"><div class="detailhead"><small>선택한 날짜</small></div><h2 id="chosen"></h2><div id="entries"></div></article></section><section id="week" class="card week tape" hidden><div class="pager"><button data-move="-1" aria-label="지난주">‹</button><strong id="range"></strong><button data-move="1" aria-label="다음 주">›</button></div><div id="rows"></div></section></div></div></main></div>
<script src="../page-motion.js"></script>
<script>
const canvas = document.querySelector('.canvas');
const page = canvas.querySelector('main');
function fitCanvas() {
  if(matchMedia('(max-width:700px)').matches){
    page.style.transform='';
    canvas.style.height='';
    return;
  }
  const scale = canvas.getBoundingClientRect().width / 940;
  page.style.transform = 'scale(' + scale + ')';
  canvas.style.height = page.offsetHeight * scale + 'px';
}
const fitObserver = new ResizeObserver(fitCanvas);
fitObserver.observe(canvas);
fitObserver.observe(page);
fitCanvas();
const events={16:[['20:00','피아노 신청곡']],17:[['','휴방']],18:[['19:30','노래 연습실']],19:[['20:00','피아노 연주'],['21:30','신청곡 앵콜']],20:[['20:00','노래방']],21:[['18:00','주말 합주']],22:[['','휴방']]};
function koreaToday(){
 const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date());
 const value=type=>Number(parts.find(part=>part.type===type).value);
 return new Date(value('year'),value('month')-1,value('day'));
}
let selected=koreaToday(), weekly=location.hash==='#week';
const $=id=>document.getElementById(id),days='일월화수목금토', shift=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n),label=d=>(d.getMonth()+1)+'월 '+d.getDate()+'일',list=d=>d.getFullYear()===2026&&d.getMonth()===10?events[d.getDate()]||[]:[];
function render(){
 const today=koreaToday();
 const y=selected.getFullYear(),m=selected.getMonth(),d=selected.getDate();
 $('monthly').setAttribute('aria-pressed',!weekly);$('weekly').setAttribute('aria-pressed',weekly);
 $('ym').textContent=y+'년 '+(m+1)+'월';$('chosen').textContent=label(selected)+' '+days[selected.getDay()]+'요일';
 const items=list(selected);
 $('entries').innerHTML=items.map(([time,title])=>{
   const heading=time?'<time>'+time+'</time>':'';
   return '<div class="event '+(time?'':'off')+'">'+heading+'<strong>'+title+'</strong></div>';
 }).join('')||'<p class="empty">등록된 일정이 없어요.</p>';
 let html=[...days].map(v=>'<span class="weekday">'+v+'</span>').join('')+'<span></span>'.repeat(new Date(y,m,1).getDay());
 for(let i=1;i<=new Date(y,m+1,0).getDate();i++){
   const date=new Date(y,m,i), entries=list(date);
   const status=entries.some(([time])=>time)?'방송':entries.length?'휴방':'';
   const color=status==='방송'?'has-show':status==='휴방'?'off-day':'';
   const weekday=['sun','','','','','','sat'][date.getDay()];
   const current=+date===+today?' aria-current="date"':'';
   html+='<button '+current+' class="day '+weekday+' '+color+'" aria-label="'+[label(date),status].filter(Boolean).join(' · ')+'" aria-pressed="'+(d===i)+'" data-day="'+i+'">'+i+'</button>';
 }
 $('grid').innerHTML=html;const mon=shift(selected,-((selected.getDay()+6)%7)),sun=shift(mon,6);
 $('range').textContent=mon.getFullYear()+'년 '+label(mon)+' – '+label(sun);
 $('rows').innerHTML=Array.from({length:7},(_,i)=>{const date=shift(mon,i),items=list(date);return '<div class="row '+(+date===+selected?'active':'')+'"><span class="date"><b>'+days[date.getDay()]+'</b>　'+(date.getMonth()+1)+'.'+date.getDate()+'</span><time>'+items.map(v=>v[0]||'—').join('<br>')+'</time><strong>'+(items.map(v=>v[1]).join('<br>')||'일정 없음')+'</strong>'+(items.length?'<span class="tag '+(items[0][0]?'':'resting')+'">'+(items[0][0]?'방송':'휴방')+'</span>':'')+'</div>'}).join('');
}
const turnView=createPageTurn(document.querySelector('.views'),[$('month'),$('week')],Number(weekly));
function switchView(toWeek){
  if(toWeek===weekly)return;
  weekly=toWeek;
  history.replaceState(null,'',weekly?'#week':'#month');
  render();
  turnView(Number(weekly));
}
window.addEventListener('hashchange',()=>switchView(location.hash==='#week'));
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='weekly'||b.id==='monthly'){switchView(b.id==='weekly');return}else if(b.dataset.day){selected=new Date(selected.getFullYear(),selected.getMonth(),Number(b.dataset.day))}else if(b.dataset.move){const n=Number(b.dataset.move);selected=weekly?shift(selected,7*n):new Date(selected.getFullYear(),selected.getMonth()+n,1)}render();if(b.dataset.day)$('grid').querySelector('[aria-pressed=true]').focus()});render();
</script></html>
