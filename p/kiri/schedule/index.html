<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>키리 · 방송 일정</title>
<style>
@font-face{font-family:Gaegu;src:url('../assets/Gaegu-Bold.ttf');font-weight:700;font-display:swap}
*{box-sizing:border-box}
body{margin:0;background:#eff7ff;color:#354e79;font:600 16px/1.4 system-ui,sans-serif}
.canvas{position:relative;width:min(100%,940px);aspect-ratio:940/920;margin:auto;overflow:clip}
main{position:absolute;inset:0 auto auto 0;width:940px;height:920px;transform-origin:top left;background:url('../assets/schedule.png') center/100% 100% no-repeat}
.hero a{position:absolute;top:6%;right:2%;width:13%;height:4.5%}
button{font:inherit;color:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid #776dc1;outline-offset:1px}
.sheet{position:absolute;inset:33.6% 12% 13.8% 13%;display:grid;grid-template-rows:auto 1fr;gap:16px}
.bar,.tabs,.pager{display:flex;align-items:center}
.bar,.pager{justify-content:space-between}
.tabs{gap:8px}
.tabs button,.pager button{border:1px solid #bbcbe4;background:#fffaf6;border-radius:14px}
.tabs button{font:700 23px/1 Gaegu,sans-serif;padding:7px 14px;box-shadow:0 2px 0 #cbd5e9}
.tabs [aria-pressed=true]{background:#ffe7f2;border-color:#dfacc9;color:#89456c}
.sample,.legend,.detailhead{font-size:13px;color:#677791}
.views{display:grid;isolation:isolate;overflow:clip}
#month,#week{grid-area:1/1;min-width:0;padding:8px 2px}
.views.moving>section{background:#fbf9f5}
.views [hidden]{visibility:hidden;pointer-events:none}
#month{display:grid;grid-template-columns:1.15fr 1fr;gap:22px}
#month[hidden]{display:grid}#week[hidden]{display:block}
.card{min-width:0}
.pager strong,h2{font:700 31px/1.2 Gaegu,sans-serif;color:#405991}
.pager button{width:36px;height:32px;background:#eef5ff;font-size:19px}
.grid{margin-top:14px;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto repeat(6,44px);text-align:center;align-items:center}
.weekday{font:700 20px Gaegu,sans-serif}
.day{position:relative;border:0;border-radius:13px;height:38px;background:transparent}
.day:hover{background:#e5f1ff}.day[aria-pressed=true]{background:#ffdfec;box-shadow:inset 0 0 0 1.5px #e59aba}
.dot:after{content:'';position:absolute;bottom:3px;left:calc(50% - 2px);width:5px;height:5px;border-radius:50%;background:#648cc2}.rest.dot:after{background:#a391c6}
.sun{color:#a95176}.sat{color:#4578aa}.legend{margin:8px 0}
.detail{border-left:2px dashed #ced8e8;padding-left:20px}.detailhead{margin-top:5px}
h2{margin:7px 0 18px}.event{position:relative;margin:10px 2px;padding:10px 12px;background:#e8f6fa;border:1px dashed #a8cbd7;border-radius:12px}
.event strong,.event small{display:block}.event strong{font:700 24px Gaegu,sans-serif}.off{background:#f0eafa}.tag{font:700 18px Gaegu,sans-serif;color:#526c93}.resting{color:#8a659a}
.week .pager{margin-bottom:12px}.row{display:grid;grid-template-columns:104px 70px 1fr 44px;align-items:center;padding:5px 12px;min-height:46px;border-bottom:1px dashed #c3cfe1;gap:10px}
.row.active{background:#ffe7f0;border-radius:12px}.row strong{font:700 23px Gaegu,sans-serif}.row time{font-variant-numeric:tabular-nums}.empty{color:#6d7d95}
</style>
<div class="canvas"><main><header class="hero" aria-label="키리 방송 일정"><a href="../profile/index.html" aria-label="상세 프로필 보기"></a></header><div class="sheet"><div class="bar"><nav class="tabs" aria-label="일정 보기"><button id="monthly">월간 달력</button><button id="weekly">주간 일정</button></nav><span class="sample">예시 일정 · 한국 시간</span></div><div class="views"><section id="month" class="cols"><div class="card tape"><div class="pager"><button data-move="-1" aria-label="이전 달">‹</button><strong id="ym"></strong><button data-move="1" aria-label="다음 달">›</button></div><div class="grid" id="grid"></div><p class="legend">● 방송　<span style="color:#8765aa">● 휴방</span></p></div><article class="card detail" aria-live="polite"><div class="detailhead"><small>선택한 날짜</small></div><h2 id="chosen"></h2><div id="entries"></div></article></section><section id="week" class="card week tape" hidden><div class="pager"><button data-move="-1" aria-label="지난주">‹</button><strong id="range"></strong><button data-move="1" aria-label="다음 주">›</button></div><div id="rows"></div></section></div></div></main></div>
<script src="../page-motion.js"></script>
<script>
const canvas = document.querySelector('.canvas');
const page = canvas.querySelector('main');
function fitCanvas() {
  const scale = canvas.getBoundingClientRect().width / 940;
  page.style.transform = 'scale(' + scale + ')';
  canvas.style.height = page.offsetHeight * scale + 'px';
}
const fitObserver = new ResizeObserver(fitCanvas);
fitObserver.observe(canvas);
fitObserver.observe(page);
fitCanvas();
const events={16:[['20:00','피아노 신청곡']],17:[['','휴방']],18:[['19:30','노래 연습실']],19:[['20:00','피아노 연주'],['21:30','신청곡 앵콜']],20:[['20:00','노래방']],21:[['18:00','주말 합주']],22:[['','휴방']]};
let selected=new Date(2026,10,19), weekly=location.hash==='#week';
const $=id=>document.getElementById(id),days='일월화수목금토', shift=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n),label=d=>(d.getMonth()+1)+'월 '+d.getDate()+'일',list=d=>d.getFullYear()===2026&&d.getMonth()===10?events[d.getDate()]||[]:[];
function render(){
 const y=selected.getFullYear(),m=selected.getMonth(),d=selected.getDate();
 $('month').hidden=weekly;$('week').hidden=!weekly;$('monthly').setAttribute('aria-pressed',!weekly);$('weekly').setAttribute('aria-pressed',weekly);
 $('ym').textContent=y+'년 '+(m+1)+'월';$('chosen').textContent=label(selected)+' '+days[selected.getDay()]+'요일';
 const items=list(selected);$('entries').innerHTML=items.map(([t,s])=>'<div class="event '+(t?'':'off')+'"><span class="tag">'+(t?'방송':'휴방')+'</span><strong>'+s+'</strong><small>'+(t||'예정된 방송을 쉬어요.')+'</small></div>').join('')||'<p class="empty">등록된 일정이 없어요.</p>';
 let html=[...days].map(v=>'<span class="weekday">'+v+'</span>').join('')+'<span></span>'.repeat(new Date(y,m,1).getDay());
 for(let i=1;i<=new Date(y,m+1,0).getDate();i++){const date=new Date(y,m,i),items=list(date);html+='<button class="day '+(items.length?'dot ':'')+(items.length&&!items[0][0]?'rest ':'')+(['sun','','','','','','sat'][date.getDay()])+'" aria-label="'+label(date)+'" aria-pressed="'+(d===i)+'" data-day="'+i+'">'+i+'</button>'}
 $('grid').innerHTML=html;const mon=shift(selected,-((selected.getDay()+6)%7)),sun=shift(mon,6);
 $('range').textContent=mon.getFullYear()+'년 '+label(mon)+' – '+label(sun);
 $('rows').innerHTML=Array.from({length:7},(_,i)=>{const date=shift(mon,i),items=list(date);return '<div class="row '+(+date===+selected?'active':'')+'"><span class="date"><b>'+days[date.getDay()]+'</b>　'+(date.getMonth()+1)+'.'+date.getDate()+'</span><time>'+items.map(v=>v[0]||'—').join('<br>')+'</time><strong>'+(items.map(v=>v[1]).join('<br>')||'일정 없음')+'</strong>'+(items.length?'<span class="tag '+(items[0][0]?'':'resting')+'">'+(items[0][0]?'방송':'휴방')+'</span>':'')+'</div>'}).join('');
}
let movement=[];
function switchView(toWeek){
  if(toWeek===weekly)return;
  movement.forEach(effect=>effect.cancel());
  movement=[];
  const views=document.querySelector('.views');
  views.classList.remove('moving');
  const month=$('month'),week=$('week');
  const outgoing=weekly?week:month;
  weekly=toWeek;
  history.replaceState(null,'',weekly?'#week':'#month');
  render();
  month.inert=weekly;
  week.inert=!weekly;
  week.style.zIndex='';
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  views.classList.add('moving');
  outgoing.hidden=false;
  week.style.zIndex='1';
  movement=slideSheets(week,month,weekly);
  const slide=movement[0];
  slide.onfinish=()=>{
    if(movement[0]!==slide)return;
    views.classList.remove('moving');
    outgoing.hidden=true;
    week.style.zIndex='';
    movement.forEach(effect=>effect.cancel());
    movement=[];
  };
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='weekly'||b.id==='monthly'){switchView(b.id==='weekly');return}else if(b.dataset.day){selected=new Date(selected.getFullYear(),selected.getMonth(),Number(b.dataset.day))}else if(b.dataset.move){const n=Number(b.dataset.move);selected=weekly?shift(selected,7*n):new Date(selected.getFullYear(),selected.getMonth()+n,1)}render();if(b.dataset.day)$('grid').querySelector('[aria-pressed=true]').focus()});render();
</script></html>
